<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Censorio - Redact Sensitive Info</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      try {
        var t = localStorage.getItem('censorio-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
        var lang = localStorage.getItem('censorio-lang');
        if (lang === 'ru' || lang === 'en')
          document.documentElement.setAttribute('lang', lang);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="styles/main.css" />
    <script type="importmap">
      {
        "imports": {
          "preact": "https://esm.sh/preact@10.24.3",
          "preact/hooks": "https://esm.sh/preact@10.24.3/hooks",
          "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
